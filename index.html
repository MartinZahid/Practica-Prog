<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>CodeRuta</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  :root{
    --bg:#0b1120; --bg2:#0f172a; --card:#16203a; --card2:#1c2a4a;
    --txt:#e8eefc; --muted:#93a4c7; --line:#26375f;
    --accent:#38bdf8; --accent2:#818cf8; --ok:#22c55e; --bad:#f43f5e; --warn:#f59e0b;
    --grad:linear-gradient(135deg,#38bdf8,#818cf8);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:radial-gradient(1200px 600px at 100% -10%,#1e293b 0%,transparent 60%),var(--bg);
    color:var(--txt); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
    min-height:100vh; padding-bottom:84px; overscroll-behavior-y:none;
  }
  .wrap{max-width:560px;margin:0 auto;padding:0 16px}
  h1,h2,h3{margin:0}
  .topbar{position:sticky;top:0;z-index:20;backdrop-filter:blur(12px);
    background:linear-gradient(180deg,rgba(11,17,32,.92),rgba(11,17,32,.65));
    border-bottom:1px solid var(--line);padding:12px 0}
  .topbar .wrap{display:flex;align-items:center;gap:10px}
  .logo{font-weight:800;font-size:20px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.3px}
  .spacer{flex:1}
  .chip{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);
    padding:6px 10px;border-radius:999px;font-size:13px;font-weight:700}
  .chip .flame{filter:grayscale(.2)}
  .chip.streak{border-color:#f9731644;background:linear-gradient(135deg,#7c2d1222,#f59e0b22)}
  .hero{margin:18px 0 6px;padding:18px;border-radius:20px;
    background:linear-gradient(135deg,#1e293b,#132043);border:1px solid var(--line)}
  .hero h2{font-size:22px}
  .hero p{color:var(--muted);margin:6px 0 14px;font-size:14px;line-height:1.5}
  .bar{height:12px;border-radius:999px;background:#0d1730;overflow:hidden;border:1px solid var(--line)}
  .bar > i{display:block;height:100%;background:var(--grad);border-radius:999px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
  .lvrow{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin:10px 0 6px;font-weight:700}
  .sectiontitle{margin:22px 4px 10px;font-size:14px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);font-weight:800}
  .track{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
  .trackhead{display:flex;align-items:center;gap:12px}
  .trackicon{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:24px;
    background:#0d1730;border:1px solid var(--line)}
  .trackhead b{font-size:17px}
  .trackhead small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
  .trackbar{height:8px;border-radius:999px;background:#0d1730;overflow:hidden;margin-top:12px;border:1px solid var(--line)}
  .trackbar>i{display:block;height:100%;border-radius:999px;transition:width .5s}
  .lessons{margin-top:14px;display:flex;flex-direction:column;gap:8px}
  .lesson{display:flex;align-items:center;gap:12px;padding:12px 12px;border-radius:14px;background:var(--card2);
    border:1px solid transparent;cursor:pointer;transition:transform .12s}
  .lesson:active{transform:scale(.98)}
  .lesson .dot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:800;
    background:#0d1730;border:2px solid var(--line);flex:none}
  .lesson.done .dot{background:var(--ok);border-color:var(--ok);color:#04120a}
  .lesson .lt{flex:1;font-size:14.5px;font-weight:600}
  .lesson .lt small{display:block;color:var(--muted);font-weight:500;font-size:12px;margin-top:1px}
  .chev{color:var(--muted);font-size:18px}
  .bottombar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(13,23,48,.96);
    backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  .bottombar .wrap{display:flex;max-width:560px;margin:0 auto;padding:8px 16px}
  .navbtn{flex:1;background:none;border:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;
    font-size:11px;font-weight:700;padding:6px;cursor:pointer}
  .navbtn .ico{font-size:20px}
  .navbtn.active{color:var(--accent)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
  .muted{color:var(--muted)}
  .btn{border:0;border-radius:14px;padding:14px 16px;font-size:15px;font-weight:800;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s,filter .2s}
  .btn:active{transform:scale(.97)}
  .btn.primary{background:var(--grad);color:#06122b;width:100%}
  .btn.ghost{background:var(--card2);color:var(--txt);border:1px solid var(--line)}
  .btn.ok{background:var(--ok);color:#04120a}
  .btn.small{padding:10px 14px;font-size:13.5px;border-radius:12px}
  .row{display:flex;gap:10px}
  .row>*{flex:1}
  .pill{display:inline-block;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.4px}
  .theory{line-height:1.65;font-size:15px}
  .theory p{margin:10px 0}
  .theory code{background:#0d1730;padding:2px 6px;border-radius:6px;font-size:13.5px;color:#7dd3fc}
  .theory pre,.codebox pre{margin:10px 0;background:#0a1226;border:1px solid var(--line);border-radius:12px;padding:12px;
    overflow-x:auto;font-size:13.5px;line-height:1.5;color:#a5f3fc}
  .codebox textarea{width:100%;min-height:150px;background:#0a1226;color:#e2e8f0;border:1px solid var(--line);
    border-radius:14px;padding:12px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;line-height:1.5;resize:vertical}
  .outbox{margin-top:10px;background:#08101f;border:1px solid var(--line);border-radius:12px;padding:12px;font-family:ui-monospace,monospace;
    font-size:13.5px;white-space:pre-wrap;min-height:24px;color:#cbd5e1}
  .outbox.err{color:#fda4af;border-color:#f43f5e55}
  .outbox.ok{color:#86efac;border-color:#22c55e55}
  .opt{display:flex;gap:12px;align-items:center;background:var(--card2);border:1px solid var(--line);border-radius:14px;
    padding:14px;margin-bottom:10px;cursor:pointer;font-size:14.5px}
  .opt.sel{border-color:var(--accent);background:#152546}
  .opt.right{border-color:var(--ok);background:#052e1a}
  .opt.wrong{border-color:var(--bad);background:#2e0511}
  .opt .k{width:26px;height:26px;border-radius:8px;background:#0d1730;display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
  .badge{position:relative}
  .toast{position:fixed;left:50%;top:14px;transform:translateX(-50%) translateY(-40px);z-index:60;background:#0d1730;
    border:1px solid var(--line);color:var(--txt);padding:12px 18px;border-radius:14px;font-weight:700;font-size:14px;
    opacity:0;transition:all .35s;box-shadow:0 10px 30px #0008;max-width:90vw;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .achievements{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  .ach{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:center}
  .ach.locked{opacity:.5;filter:grayscale(1)}
  .ach .em{font-size:34px}
  .ach b{display:block;font-size:13.5px;margin-top:6px}
  .ach small{color:var(--muted);font-size:11.5px;display:block;margin-top:3px;line-height:1.35}
  .statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .stat{background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:14px 8px;text-align:center}
  .stat b{display:block;font-size:22px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .stat small{color:var(--muted);font-size:11.5px}
  .backbar{display:flex;align-items:center;gap:10px;margin:14px 0}
  .backbtn{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 12px;color:var(--txt);font-weight:700;cursor:pointer}
  .hint{background:#2a1f0a;border:1px solid #f59e0b55;color:#fcd34d;border-radius:12px;padding:12px;font-size:14px;margin-top:10px}
  .confetti{position:fixed;top:-20px;width:10px;height:14px;z-index:70;pointer-events:none;border-radius:2px;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.9}}
  .fadein{animation:fadein .3s ease}
  @keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  a{color:var(--accent)}
  .stepimg{font-size:40px;text-align:center;padding:6px}
  .goalbox{margin-top:14px}
  .bar.goal>i{background:linear-gradient(90deg,#f59e0b,#22c55e)}
  .week{margin-top:14px}
  .weekrow{display:flex;gap:6px}
  .day{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px}
  .day .d{font-size:11px;color:var(--muted);font-weight:800}
  .day .dot2{width:30px;height:30px;border-radius:10px;background:#0d1730;border:1px solid var(--line);display:grid;place-items:center;font-size:14px}
  .day.on .dot2{background:linear-gradient(135deg,#f59e0b,#f97316);border-color:#f97316}
  .day.today .dot2{border-color:var(--accent)}
  .day.on .d,.day.today .d{color:var(--txt)}
  .path{position:relative;padding:16px 0 6px;display:flex;flex-direction:column;align-items:center;gap:8px}
  .path::before{content:'';position:absolute;top:26px;bottom:26px;left:50%;width:4px;margin-left:-2px;
    background:repeating-linear-gradient(var(--line) 0 7px,transparent 7px 15px);border-radius:2px;z-index:0}
  .pstep{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;width:100%}
  .nodeShift{transition:transform .15s}
  .node{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-size:24px;font-weight:800;
    background:var(--card2);border:3px solid var(--line);color:var(--muted);cursor:pointer;
    box-shadow:0 5px 0 rgba(0,0,0,.28);transition:transform .12s}
  .node:active{transform:scale(.94)}
  .node.done{background:linear-gradient(135deg,#22c55e,#16a34a);border-color:#16a34a;color:#04120a}
  .node.current{background:var(--grad);border-color:#38bdf8;color:#06122b;animation:pulse 1.7s infinite}
  .node.locked{background:#0d1730;border-color:#1b2b4d;color:#3b4d78;box-shadow:none;cursor:not-allowed}
  @keyframes pulse{0%,100%{box-shadow:0 5px 0 rgba(0,0,0,.28),0 0 0 0 #38bdf866}50%{box-shadow:0 5px 0 rgba(0,0,0,.28),0 0 0 12px #38bdf800}}
  .ntitle{font-size:11.5px;color:var(--muted);margin-top:7px;text-align:center;max-width:132px;line-height:1.3;font-weight:600}
  .startbubble{font-size:10px;font-weight:900;letter-spacing:.5px;background:#fff;color:#0b1120;
    padding:3px 10px;border-radius:999px;margin-bottom:5px;animation:bob 1.2s ease-in-out infinite;z-index:2}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  .trackfilter{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none}
  .trackfilter::-webkit-scrollbar{display:none}
  .tchip{flex:0 0 auto;font-size:12.5px;font-weight:700;color:#cfe3ff;background:#13213d;border:1px solid #22345a;border-radius:999px;padding:7px 12px;cursor:pointer;white-space:nowrap}
  .tchip:active{transform:scale(.96)}
  .tchip.top{background:var(--grad);color:#06122b;border-color:transparent}
  .track.trackhi{outline:2px solid #38bdf8;outline-offset:2px}
  /* --- Motor de beats (método Mimo) --- */
  .beatcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
  .codecard{margin-top:12px;background:#0a1226;border:1px solid var(--line);border-radius:12px;padding:12px;
    font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;line-height:2;color:#a5f3fc;white-space:pre-wrap;word-break:break-word}
  .gap{display:inline-block;min-width:64px;padding:1px 8px;margin:0 2px;border-bottom:2px dashed var(--accent);
    background:#12203f;border-radius:6px;text-align:center;color:#7dd3fc;cursor:pointer;font-weight:700}
  .gap.empty{color:transparent}
  .gap.ok{border-bottom-color:var(--ok);background:#052e1a;color:#86efac}
  .gap.bad{border-bottom-color:var(--bad);background:#2e0511;color:#fda4af}
  .gapinput{background:#0a1226;border:1px solid var(--accent);border-radius:8px;color:#7dd3fc;
    font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;padding:2px 6px;min-width:70px}
  .chipsrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .chipc{background:var(--card2);border:1px solid var(--line);border-bottom-width:3px;border-radius:12px;padding:9px 13px;
    font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13.5px;font-weight:700;color:var(--txt);cursor:pointer;transition:transform .1s}
  .chipc:active{transform:scale(.95)}
  .chipc.used{opacity:.28;pointer-events:none}
  .previewframe{width:100%;height:190px;border:1px solid var(--line);border-radius:12px;background:#fff;margin-top:8px}
  .chip.userchip{cursor:pointer;font-family:inherit}
  .modal{position:fixed;inset:0;background:rgba(3,7,18,.62);backdrop-filter:blur(3px);display:none;align-items:flex-end;justify-content:center;z-index:80}
  .modal.show{display:flex}
  .sheet{width:100%;max-width:480px;background:#0f1b33;border:1px solid var(--line);border-radius:18px 18px 0 0;padding:16px 16px 26px;animation:sheetin .22s ease}
  @keyframes sheetin{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
  .sheet .lvrow{display:flex;justify-content:space-between;align-items:center}
  .xbtn{background:none;border:0;color:#93a4c3;font-size:18px;cursor:pointer}
  .urow{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
  .uinfo{flex:1;font-size:14px;min-width:0}
  .urow.cur .uinfo b{color:#38bdf8}
  .usub{font-size:12px;color:#8ba0c0}
  .utag{font-size:10px;background:#13213d;border:1px solid #22345a;border-radius:6px;padding:1px 5px;color:#38bdf8}
  .newuser{display:flex;gap:8px;margin-top:12px}
  .newuser input{flex:1;min-width:0;background:#0a152a;border:1px solid var(--line);color:#eaf2ff;border-radius:10px;padding:10px;font-size:14px}
  .newuser .btn,.urow .btn{width:auto;flex:0 0 auto;padding:9px 14px;font-size:12.5px}
  .urow .btn.ghost.small{padding:9px 10px}
  @media(max-width:430px){#userName{display:none}}
</style>
</head>
<body>
<div class="topbar">
  <div class="wrap">
    <span class="logo">CodeRuta</span>
    <span class="spacer"></span>
    <button class="chip userchip" onclick="openUsers()" title="Cambiar usuario">👤 <span id="userName">Invitado</span></button>
    <span class="chip streak" id="chipStreak">🔥 0</span>
    <span class="chip" id="chipXp">⭐ 0 XP</span>
  </div>
</div>

<div id="app"></div>

<div class="bottombar">
  <div class="wrap">
    <button class="navbtn" data-nav="learn" onclick="go('learn')"><span class="ico">📚</span>Aprender</button>
    <button class="navbtn" data-nav="review" onclick="go('review')"><span class="ico">🔁</span>Repaso</button>
    <button class="navbtn" data-nav="challenge" onclick="go('challenge')"><span class="ico">🎯</span>Reto</button>
    <button class="navbtn" data-nav="achievements" onclick="go('achievements')"><span class="ico">🏆</span>Logros</button>
    <button class="navbtn" data-nav="help" onclick="go('help')"><span class="ico">❔</span>Ayuda</button>
  </div>
</div>

<div class="modal" id="userModal" onclick="if(event.target===this) closeUsers()">
  <div class="sheet">
    <div class="lvrow"><b>👤 Usuarios</b><button class="xbtn" onclick="closeUsers()">✕</button></div>
    <p style="font-size:12.5px;color:#8ba0c0;margin:6px 0 2px">Cada usuario guarda su propio progreso en este dispositivo.</p>
    <div id="userList"></div>
    <div class="newuser">
      <input id="newUser" placeholder="Nuevo usuario" maxlength="16" onkeydown="if(event.key==='Enter') createUserFromInput()">
      <button class="btn primary small" onclick="createUserFromInput()">Añadir</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="data/index.js"></script>
<script>
/* ============================================================
   CodeRuta - app de aprendizaje de programación (offline)
   XP · niveles · rachas · logros · retos · ejercicios reales
   ============================================================ */

const KEY = 'coderuta_v1';

const TRACKS = [
  {id:'logic', name:'Lógica', icon:'🧠', color:'#8b5cf6', desc:'Piensa como programador'},
  {id:'js',    name:'Fundamentos de JavaScript', icon:'🌐', color:'#f59e0b', desc:'Tus primeros pasos en JS'},
  {id:'py',    name:'Fundamentos de Python', icon:'🐍', color:'#22c55e', desc:'Tus primeros pasos en Python'},
  {id:'html',  name:'Fundamentos de Web', icon:'🎨', color:'#e34f26', desc:'Tus primeras páginas'},
];

/* --------------------------- Lecciones --------------------------- */
const LESSONS = [
  /* -------- LÓGICA (quizzes) -------- */
  {id:'l1', track:'logic', title:'¿Qué es un algoritmo?', type:'quiz',
   theory:`<div class="theory">
     <p>Un <b>algoritmo</b> es una <b>lista de pasos ordenados</b> para resolver un problema. ¡Como una receta de cocina!</p>
     <p>Ejemplo: para hacer un sándwich → 1) tomar pan, 2) untar mantequilla, 3) poner jamón, 4) cerrar.</p>
     <p>Los computadores son obedientes: hacen <b>exactamente</b> lo que les dices, en el orden que les dices.</p>
   </div>`,
   q:'¿Cuál de estos es un algoritmo?',
   options:['Escribir una receta paso a paso','Pensar en un color','Soñar con código'],
   answer:0,
   explain:'Un algoritmo son pasos ordenados y claros. La receta lo es.'},

  {id:'l2', track:'logic', title:'Variables: cajas con nombre', type:'quiz',
   theory:`<div class="theory">
     <p>Una <b>variable</b> es como una <b>caja</b> con un nombre donde guardas un dato: un número, un texto, etc.</p>
     <p><code>edad = 20</code> → guarda 20 en la caja llamada "edad".</p>
     <p>Puedes leerla y cambiarla cuando quieras.</p>
   </div>`,
   q:'Si tienes <code>edad = 20</code>, ¿qué guarda la caja "edad"?',
   options:['La palabra "edad"','El número 20','Nada'],
   answer:1,
   explain:'La variable "edad" guarda el valor 20.'},

  {id:'l3', track:'logic', title:'Condicionales: tomar decisiones', type:'quiz',
   theory:`<div class="theory">
     <p>Con un <b>condicional</b> el programa decide: <i>"SI pasa esto → haz aquello, SI NO → haz lo otro"</i>.</p>
     <p>Ejemplo: <code>SI llueve → llevo paraguas</code>.</p>
     <p>La condición es algo que se puede responder con <b>verdadero</b> o <b>falso</b>.</p>
   </div>`,
   q:'"SI tengo hambre, entonces como" — ¿qué parte es la condición?',
   options:['como','tengo hambre','entonces'],
   answer:1,
   explain:'"tengo hambre" es lo que se evalúa (verdadero o falso).'},

  {id:'l4', track:'logic', title:'Bucles: repetir sin cansarse', type:'quiz',
   theory:`<div class="theory">
     <p>Un <b>bucle</b> repite una acción varias veces sin que la escribas mil veces.</p>
     <p>Ejemplo: "haz 10 lagartijas" → repites 10 veces la misma acción.</p>
     <p>¡Cuidado! Si nunca termina, es un <b>bucle infinito</b>.</p>
   </div>`,
   q:'¿Para qué sirve un bucle?',
   options:['Para repetir algo muchas veces','Para apagar el PC','Para borrar archivos'],
   answer:0,
   explain:'Repite instrucciones sin repetir el código.'},

  {id:'l5', track:'logic', title:'Funciones: bloques reutilizables', type:'quiz',
   theory:`<div class="theory">
     <p>Una <b>función</b> es un bloque de código con nombre que puedes <b>reutilizar</b>.</p>
     <p>Puede <b>recibir datos</b> (parámetros) y <b>devolver</b> un resultado.</p>
     <p>Ejemplo: <code>saludar("Ana")</code> → dice "Hola Ana".</p>
   </div>`,
   q:'¿Cuál es la ventaja principal de una función?',
   options:['Ocupa más memoria','Reutilizar código y ordenarlo','Hace el código más lento'],
   answer:1,

const PROFILES_KEY = 'coderuta_profiles_v1';
function loadProfile(){
  try{
    const p = JSON.parse(localStorage.getItem(PROFILES_KEY));
    if(p && p.current && Array.isArray(p.list) && p.list.length && p.list.indexOf(p.current)>=0) return p;
  }catch(e){}
  return {current:'Invitado', list:['Invitado']};
}

function stateKey(name){ return KEY+'::'+name; }

let state = load();

function defaultState(){
  return {xp:0, completed:{}, drafts:{}, streak:0, lastDay:null,
          lastChallengeDay:null, achievements:{}, started:false,
          goal:50, todayXp:0, todayDate:null, days:{}, reviews:0,
          goalMetDay:null, goalsMet:0, hard:false, sound:true, beatPos:{}};
}
function load(){
  const k = stateKey(profile.current);
  try{
    let raw = localStorage.getItem(k);
    if(raw===null){ raw = localStorage.getItem(KEY); if(raw!==null) localStorage.setItem(k, raw); }
    if(raw!==null){ const s = JSON.parse(raw); if(s && typeof s==='object') return Object.assign(defaultState(), s); }
  }catch(e){}
  return defaultState();
}

/* --------- Meta diaria / calendario de racha --------- */
function ensureToday(){
  const t = today();
  if(state.todayDate !== t){ state.todayDate = t; state.todayXp = 0; }
}
function weekHtml(){
  const names = ['D','L','M','M','J','V','S'];
  let h = '<div class="week"><div class="weekrow">';
  for(let i=6;i>=0;i--){
    const d = new Date(); d.setDate(d.getDate()-i);
    const key = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    const act = !!state.days[key];
    const isToday = i===0;
    h += `<div class="day ${act?'on':''} ${isToday?'today':''}">
      <span class="d">${names[d.getDay()]}</span>
      <span class="dot2">${act?'🔥':''}</span>
    </div>`;
  }
  h += '</div></div>';
  return h;
}
function setGoal(n){ state.goal = n; save(); render(); toast('Meta diaria: '+n+' XP 🎯'); }
function countCompleted(s){ return Object.keys(s.completed||{}).length; }
function crTrackMeta(track){ return (window.CR_INDEX && CR_INDEX.tracks || []).filter(t=>t.id===track)[0] || null; }
function lessonById(id){ return LESSONS.filter(l=>l.id===id)[0] || null; }
function trackLessons(track){
  const t = crTrackMeta(track);
  if(t) return t.ids.map(lessonById).filter(Boolean);
  return LESSONS.filter(l=>l.track===track);
}
function trackDone(s,track){ const ls=trackLessons(track); return ls.length>0 && ls.every(l=>s.completed[l.id]); }

/* ============================ Fechas / racha ============================ */
function today(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function daysBetween(a,b){ return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000); }

function markActivity(){
  const t = today();
  ensureToday();
  state.days = state.days || {};
  state.days[t] = true;
  if(state.lastDay === t) { /* ya contó hoy */ }
  else if(state.lastDay && daysBetween(state.lastDay, t) === 1){ state.streak = (state.streak||0)+1; state.lastDay=t; }
  else { state.streak = 1; state.lastDay = t; }
}

/* ============================ XP ============================ */
function addXp(n, msg){
  ensureToday();
  state.xp = (state.xp||0)+n;
  state.days = state.days || {};
  state.days[state.todayDate] = true;
  state.todayXp = (state.todayXp||0)+n;
  const goal = state.goal||50;
  if(state.todayXp>=goal && state.goalMetDay!==state.todayDate){
    state.goalMetDay = state.todayDate;
    state.goalsMet = (state.goalsMet||0)+1;
    setTimeout(()=>{ confetti(); toast('🎯 ¡Meta diaria cumplida!'); }, 700);
  }
  const before = level(state.xp-n), after = level(state.xp);
  if(after>before) setTimeout(()=>toast('🎉 ¡Subiste al nivel '+after+'!'), 400);
  save();
}

}

let expandedTracks = {};
function buildPath(t){
  const ls = trackLessons(t.id);
  let h = '';
  let firstUnlocked = ls.findIndex(function(l,i){ return !state.completed[l.id] && (i===0 || state.completed[ls[i-1].id]); });
  if(firstUnlocked<0) firstUnlocked = Math.max(0,ls.length-1);
  const end = expandedTracks[t.id] ? ls.length : Math.min(ls.length, Math.max(30, firstUnlocked+6));
  for(let i=0;i<end;i++){
    const l = ls[i];
    const done = !!state.completed[l.id];
    const unlocked = i===0 || !!state.completed[ls[i-1].id];
    const current = !done && unlocked;
    const off = Math.round(34*Math.sin(i*Math.PI/2));
    const cls = done?'done':(unlocked?'current':'locked');
    const content = done?'✓':(unlocked?String(i+1):'🔒');
    h += `
      <div class="pstep">
        ${current?'<div class="startbubble">EMPEZAR</div>':''}
        <div class="nodeShift" style="transform:translateX(${off}px)">
          <div class="node ${cls}" onclick="${unlocked?`openLesson('${l.id}')`:'lockedTap()'}">${content}</div>
        </div>
        <div class="ntitle"${done?' style="opacity:.65"':''}>${l.title}</div>
      </div>`;
  }
  if(end < ls.length){
    h += `<button class="btn ghost small" style="margin:14px auto 0" onclick="expandTrack('${t.id}')">Ver las ${ls.length} lecciones ›</button>`;
  }
  return h;
}

  setTimeout(function(){ el.classList.remove('trackhi'); },1400);
}

  }

  /* --- Respaldo: lecciones sin beats (compatibilidad) --- */
  h += l.theory;
  if(l.type==='quiz'){
    h += `<div class="sectiontitle">Elige la respuesta</div>`;
    h += l.options.map((o,i)=>`<div class="opt" id="opt${i}" onclick="pick(${i})">
      <span class="k">${'ABCD'[i]}</span><span>${o}</span></div>`).join('');
    h += `<div id="quizfb"></div>
      <button class="btn primary" id="quizbtn" onclick="checkQuiz('${l.id}')">Comprobar</button>`;
  } else {
    h += `<div class="sectiontitle">Ejemplo</div>
      <div class="codebox"><pre>${escapeHtml(l.example)}</pre></div>
      <div class="card">
        <div class="sectiontitle" style="margin-top:0">Tu turno ✍️</div>
        <p class="muted" style="font-size:14px;margin-top:0">${l.prompt}</p>
        <div class="codebox">
          <textarea id="editor" spellcheck="false">${escapeHtml(l.starter)}</textarea>
        </div>
        <div class="outbox" id="out">› Aquí verás el resultado</div>
        <div class="row" style="margin-top:10px">
          <button class="btn ghost small" onclick="runExercise()">▶ Ejecutar</button>
          <button class="btn primary small" onclick="checkExercise('${l.id}')">Comprobar</button>
        </div>
        <div class="row" style="margin-top:8px">
          <button class="btn ghost small" onclick="showHint('${l.id}')">💡 Pista</button>
          <button class="btn ghost small" onclick="showSolutionLesson('${l.id}')">Ver solución</button>
        </div>
        <div id="hint"></div>
      </div>`;
  }
  h += `<div id="lessonExtra"></div>`;
  return h;
}

/* ============================ Motor de beats (método Mimo) ============================ */
function lessonBeats(l){ if(!l) return null; return BEATS[l.id] || (window.CR_BEATS && CR_BEATS[l.id]) || null; }
function curBeat(){ if(!openId) return null; const l=LESSONS.find(x=>x.id===openId); if(!l) return null; const bs=lessonBeats(l); return bs?bs[beatIdx]:null; }
function gapParts(code){ return String(code).split('@@'); }
function shuffleArr(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=a[i];a[i]=a[j];a[j]=t; } return a; }
function escAttr(s){ return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function enterBeat(){
  const b = curBeat();
  beatSel=null; beatOk=null; beatTypeVal=''; beatChips=[]; beatGapFill=[];
  if(b && b.k==='gap'){
    const n = gapParts(b.code).length-1;
    if(state.hard){ beatGapFill = new Array(n).fill(''); }
    else {
      beatChips = shuffleArr((b.answers||[]).concat(b.chips||[])).map((t,i)=>({id:i,t:t}));
      beatGapFill = new Array(n).fill(null);
    }
  }
}
function chipTap(cid){
  if(beatOk===true) return;
  const i = beatGapFill.indexOf(null);
  if(i<0){ toast('Toca un hueco para vaciarlo primero'); return; }
  beatGapFill[i]=cid; beatOk=null; render();
}
function gapClear(i){ if(beatOk===true) return; beatGapFill[i]=null; beatOk=null; render(); }
function pickBeatOpt(i){ if(beatOk===true) return; beatSel=i; beatOk=null; render(); }
function beatTypeInput(v){ beatTypeVal=v; beatOk=null; }
function beatHint(){ const b=curBeat(); const el=document.getElementById('beathint'); if(el) el.innerHTML='<div class="hint">💡 '+(b.hint||'')+'</div>'; }
function beatRetry(){ beatOk=null; render(); }
function toggleHard(){
  state.hard=!state.hard; save();
  const b=curBeat(); if(b && b.k==='gap') enterBeat();
  render();
  toast(state.hard?'🧠 Modo difícil: escribe de memoria':'✨ Modo normal: elige las fichas');
}
function beatCheck(){
  const b=curBeat(); if(!b) return;
  if(b.k==='mcq'){
    if(beatSel===null){ toast('Elige una opción 🙂'); return; }
    beatOk = (beatSel===b.answer);
  } else if(b.k==='gap'){
    if(beatGapFill.some(v=>v==null||v==='')){ toast('Completa todos los huecos 🙂'); return; }
    const ans=b.answers||[];
    const vals=beatGapFill.map(v=> typeof v==='number' ? (beatChips.find(c=>c.id===v)||{}).t : v);
    beatOk = vals.length===ans.length && vals.every((v,i)=>String(v).trim()===String(ans[i]).trim());
  } else if(b.k==='type'){
    const v=(document.getElementById('typein')||{}).value||'';
    if(!v.trim()){ toast('Escribe tu respuesta 🙂'); return; }
    beatOk = (b.answers||[]).some(a=>String(a).trim()===v.trim());
  } else if(b.k==='preview'){
    const v=((document.getElementById('htmleditor')||{}).value||'');
    const req=b.required||[];
    beatOk = req.every(r=>v.toLowerCase().indexOf(String(r).toLowerCase())>=0);
  }
  sfx(beatOk===true);
  if(beatOk===true) setTimeout(confetti,60);
  render();
}
function beatNext(){
  const l=LESSONS.find(x=>x.id===openId); const bs=lessonBeats(l);
  if(!l || !bs || !bs.length) return;
  if(beatIdx < bs.length-1){
    beatIdx++;
    if(!reviewMode){ state.beatPos=state.beatPos||{}; state.beatPos[openId]=beatIdx; save(); }
    enterBeat(); render(); window.scrollTo(0,0);
  }
  else {
    beatFinished=true;
    if(state.beatPos) delete state.beatPos[openId];
    const hasRun = bs.some(x=>x.k==='run');
    const xp = hasRun?20:15;
    render();
    finishLesson(l, xp);
  }
}
async function beatRunExec(){
  const b=curBeat(); const out=document.getElementById('out'); if(!out) return;
  out.className='outbox'; out.textContent='⏳ Ejecutando...';
  const res=await runCode(b.lang, document.getElementById('editor').value);
  if(res.error){ out.className='outbox err'; out.textContent='⚠️ '+res.error; }
  else { out.className='outbox'; out.textContent = res.logs.length?res.logs.join('\n'):'(sin salida: usa '+(b.lang==='python'?'print':'console.log')+' para mostrar algo)'; }
}
async function beatRunCheck(){
  const b=curBeat(); const out=document.getElementById('out'); if(!out) return;
  out.className='outbox'; out.textContent='⏳ Comprobando...';
  const res=await runCode(b.lang, document.getElementById('editor').value);
  if(res.error){ out.className='outbox err'; out.textContent='⚠️ '+res.error; return; }
  const got=res.logs.map(s=>String(s).trim()), exp=(b.expected||[]).map(s=>String(s).trim());
  const ok = got.length===exp.length && got.every((g,i)=>g===exp[i]);
  sfx(ok);
  if(ok){ beatOk=true; setTimeout(confetti,60); render(); }
  else { beatOk=false; out.className='outbox err';
    out.textContent='❌ Todavía no.\n\nObtenido:\n'+(res.logs.join('\n')||'(nada)')+'\n\nSe esperaba:\n'+(b.expected||[]).join('\n'); }
}
function beatFooter(b, isRun){
  if(beatOk===true){
    return `<div class="hint" style="margin-top:12px;background:#052e1a;border-color:#22c55e55;color:#86efac">✅ ${b.explain||'¡Correcto!'}</div>
      <button class="btn primary" style="margin-top:10px" onclick="beatNext()">Continuar ›</button>`;
  }
  if(beatOk===false){
    const msg = b.wrong || (b.k==='preview'
      ? 'Tu página aún no cumple lo que pide el enunciado. ¡Revísala e inténtalo de nuevo!'
      : (b.explain||'Casi. Inténtalo de nuevo.'));
    const btn = (b.k==='preview')
      ? '<button class="btn primary" style="margin-top:10px" onclick="beatCheck()">Comprobar</button>'
      : '<button class="btn primary" style="margin-top:10px" onclick="beatRetry()">Reintentar</button>';
    return `<div class="hint" style="margin-top:12px;background:#2e0511;border-color:#f43f5e55;color:#fda4af">❌ ${msg}</div>${btn}`;
  }
  if(isRun) return '';
  if(b.k==='preview' && !(b.required && b.required.length))
    return `<button class="btn primary" style="margin-top:12px" onclick="beatNext()">Continuar ›</button>`;
  return `<button class="btn primary" style="margin-top:12px" onclick="beatCheck()">Comprobar</button>`;
}
function renderBeat(b){
  if(!b) return '';
  if(b.k==='teach'){
    let h = `<div class="beatcard fadein">
      <div class="stepimg">${b.icon||'💡'}</div>
      <div class="theory" style="text-align:center">${b.text}${b.extra?('<p class="muted" style="font-size:14px">'+b.extra+'</p>'):''}</div>`;
    if(b.code) h += `<div class="codecard">${escapeHtml(b.code)}</div>`;
    h += `</div><button class="btn primary" onclick="beatNext()">Continuar ›</button>`;
    return h;
  }
  if(b.k==='mcq'){
    let h = `<div class="beatcard fadein">
      <div class="sectiontitle" style="margin-top:0">Elige la respuesta</div>
      <p style="font-size:16px;line-height:1.5;margin-top:4px">${b.prompt}</p>`;
    if(b.code) h += `<div class="codecard">${escapeHtml(b.code)}</div>`;
    h += b.options.map((o,i)=>{
      let cls='opt';
      if(beatOk!==null){ if(i===b.answer && beatOk===true) cls+=' right'; if(beatSel===i && beatOk===false) cls+=' wrong'; }
      else if(beatSel===i) cls+=' sel';
      return `<div class="${cls}" onclick="pickBeatOpt(${i})"><span class="k">${'ABCD'[i]}</span><span>${o}</span></div>`;
    }).join('');
    h += `</div>`;
    return h + beatFooter(b);
  }
  if(b.k==='gap'){
    const parts = gapParts(b.code);
    let codeHtml='';
    for(let i=0;i<parts.length;i++){
      codeHtml += escapeHtml(parts[i]);
      if(i<parts.length-1){
        if(state.hard){
          codeHtml += `<input class="gapinput" value="${escAttr(beatGapFill[i]||'')}" oninput="beatGapFill[${i}]=this.value;beatOk=null" spellcheck="false" autocomplete="off">`;
        } else {
          const cid=beatGapFill[i]; const used=cid!=null;
          const txt = used ? (beatChips.find(c=>c.id===cid)||{}).t : '';
          let cls='gap'+(used?'':' empty');
          if(beatOk===true) cls+=' ok'; else if(beatOk===false && used) cls+=' bad';
          codeHtml += `<span class="${cls}" onclick="gapClear(${i})">${used?escapeHtml(txt):''}</span>`;
        }
      }
    }
    let h = `<div class="beatcard fadein">
      <div class="sectiontitle" style="margin-top:0">Completa el código</div>
      <p style="font-size:15px;line-height:1.5;margin-top:4px">${b.prompt}</p>
      <div class="codecard">${codeHtml}</div>`;
    if(state.hard){
      h += `<p class="muted" style="font-size:13px;margin:10px 0 0">🧠 Modo difícil: escribe la respuesta para recordarla en vez de reconocerla.</p>`;
    } else {
      h += `<div class="chipsrow">` + beatChips.map(c=>{
        const used = beatGapFill.indexOf(c.id)>=0;
        return `<button class="chipc ${used?'used':''}" onclick="chipTap(${c.id})">${escapeHtml(c.t)}</button>`;
      }).join('') + `</div>`;
    }
    h += `</div>`;
    return h + beatFooter(b);
  }
  if(b.k==='type'){
    let h = `<div class="beatcard fadein">
      <div class="sectiontitle" style="margin-top:0">Escribe la respuesta</div>
      <p style="font-size:15px;line-height:1.5;margin-top:4px">${b.prompt}</p>`;
    if(b.code) h += `<div class="codecard">${escapeHtml(b.code)}</div>`;
    h += `<input id="typein" class="gapinput" style="width:100%;margin-top:12px;padding:13px;font-size:15px;border-radius:12px" value="${escAttr(beatTypeVal||'')}" oninput="beatTypeInput(this.value)" spellcheck="false" autocomplete="off" ${beatOk===true?'disabled':''}>
    </div>`;
    return h + beatFooter(b);
  }
  if(b.k==='run'){
    const free = !(b.expected && b.expected.length);
    let h = `<div class="beatcard fadein">
      <div class="sectiontitle" style="margin-top:0">Tu turno ✍️</div>
      <p class="muted" style="font-size:14px;margin-top:0">${b.prompt}</p>
      <div class="codebox"><textarea id="editor" spellcheck="false">${escapeHtml(b.starter||'')}</textarea></div>
      <div class="outbox" id="out">› Aquí verás el resultado</div>
      <div class="row" style="margin-top:10px">
        <button class="btn ghost small" onclick="beatRunExec()">▶ Ejecutar</button>
        ${free
          ? '<button class="btn primary small" onclick="beatNext()">Continuar ›</button>'
          : '<button class="btn primary small" onclick="beatRunCheck()">Comprobar</button>'}
      </div>
      <div class="row" style="margin-top:8px">
        <button class="btn ghost small" onclick="beatHint()">💡 Pista</button>
      </div>
      <div id="beathint"></div>
    </div>`;
    return h + beatFooter(b, true);
  }
  if(b.k==='preview'){
    let h = `<div class="beatcard fadein">
      <div class="sectiontitle" style="margin-top:0">Editor en vivo</div>
      <p style="font-size:15px;line-height:1.5;margin-top:4px">${b.prompt}</p>
      <div class="codebox"><textarea id="htmleditor" spellcheck="false" style="min-height:110px">${escapeHtml(b.starter||'')}</textarea></div>
      <div class="sectiontitle" style="margin-top:12px">Vista previa ⚡</div>
      <iframe id="preview" class="previewframe" sandbox="allow-scripts"></iframe>
    </div>`;
    return h + beatFooter(b);
  }
  return '';
}

function mountLesson(){
  const b = (openId?curBeat():null);
  const ta = document.getElementById('editor');
  if(ta && b && b.k==='run'){
    if(reviewMode){ ta.value = b.starter||''; }
    else {
      ta.value = (state.drafts[openId]!==undefined)?state.drafts[openId]:(b.starter||'');
      if(state.drafts[openId]===undefined){ state.drafts[openId]=ta.value; save(); }
    }
    ta.addEventListener('input', ()=>{ if(reviewMode) return; state.drafts[openId]=ta.value; save(); });
    ta.addEventListener('keydown', function(e){
      if(e.key==='Tab'){ e.preventDefault(); const s=this.selectionStart,en=this.selectionEnd;
        this.value=this.value.substring(0,s)+'    '+this.value.substring(en);
        this.selectionStart=this.selectionEnd=s+4; if(!reviewMode) state.drafts[openId]=this.value; }
    });
  }
  const he = document.getElementById('htmleditor');
  if(he && b && b.k==='preview'){
    if(reviewMode){ he.value = b.starter||''; }
    else {
      he.value = (state.drafts[openId]!==undefined)?state.drafts[openId]:(b.starter||'');
      if(state.drafts[openId]===undefined){ state.drafts[openId]=he.value; save(); }
    }
    he.addEventListener('input', ()=>{ if(!reviewMode){ state.drafts[openId]=he.value; save(); } previewUpdate(); });
    previewUpdate();
  }
}
function previewUpdate(){
  const he=document.getElementById('htmleditor'), fr=document.getElementById('preview');
  if(he && fr) fr.srcdoc = he.value;
}
function renderLoading(){
  const app=document.getElementById('app');
  app.innerHTML='<div class="wrap fadein"><div class="card" style="text-align:center;padding:40px 16px"><div class="stepimg">⏳</div><b>Cargando pista...</b><p class="muted" style="font-size:14px">Preparando las lecciones.</p></div></div>';
  window.scrollTo(0,0);
}
function loadTrackFile(trackId, cb){
  window.CR_TRACK_LOADED = window.CR_TRACK_LOADED || {};
  if(CR_TRACK_LOADED[trackId]){ cb(); return; }
  const s=document.createElement('script');
  s.src='data/track-'+trackId+'.js';
  s.onload=function(){ CR_TRACK_LOADED[trackId]=true; cb(); };
  s.onerror=function(){ toast('No se pudo cargar la pista 😕'); go('learn'); };
  document.head.appendChild(s);
}
function openLesson(id){
  const l=lessonById(id);
  openId=id; selectedOption=null;
  beatIdx=(state.beatPos && state.beatPos[id]) || 0; beatFinished=false; beatTypeVal='';
  if(l && l.mimo && l.homeTrack && !(window.CR_BEATS && CR_BEATS[id])){
    renderLoading();
    loadTrackFile(l.homeTrack, function(){ enterBeat(); render(); window.scrollTo(0,0); });

  enterBeat(); render(); window.scrollTo(0,0);
}

  const nuevas = checkAchievements();
  save();
  updateTop();
  if(first){ confetti(); toast('+'+xp+' XP 🎉 Lección completada'); }
  if(nuevas.length){ setTimeout(()=>nuevas.forEach(a=>toast('🏆 Logro: '+a.name)), 900); }

      </div>`;
    }
  }
  document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active', b.dataset.nav===view));
}
function nextLesson(l){
  const ls = trackLessons(l.track);

  return (i>=0 && i<ls.length-1)?ls[i+1]:null;
}

    </div>`;
  h += `<div class="sectiontitle">Todos los retos</div><div class="card"><small class="muted">Completa un reto distinto cada día para tu racha. Vuelve mañana para uno nuevo 🔁</small></div>`;
  return h;
}
async function runChallenge(){
  const c = dailyChallenge(), out=document.getElementById('cout');
  out.className='outbox'; out.textContent='⏳ Ejecutando...';
  const res = await runCode(c.lang, document.getElementById('ceditor').value);
  if(res.error){ out.className='outbox err'; out.textContent='⚠️ '+res.error; }
  else out.textContent = res.logs.join('\n') || '(sin salida)';
}
async function checkChallenge(){
  const c = dailyChallenge(), out=document.getElementById('cout');
  out.className='outbox'; out.textContent='⏳ Comprobando...';
  const res = await runCode(c.lang, document.getElementById('ceditor').value);
  if(res.error){ out.className='outbox err'; out.textContent='⚠️ '+res.error; return; }
  const got = res.logs.map(s=>String(s).trim()), exp=c.expected.map(s=>String(s).trim());
  const ok = got.length===exp.length && got.every((g,i)=>g===exp[i]);
  if(ok){
    out.className='outbox ok'; out.textContent='✅ ¡Reto superado!\n\n'+res.logs.join('\n');
    const first = state.lastChallengeDay !== today();
    state.lastChallengeDay = today();
    markActivity();
    if(first){ addXp(40); }
    checkAchievements(); save(); updateTop();
    if(first){ confetti(); toast('+40 XP 🎯 ¡Reto del día completado!'); }
    document.getElementById('cfb').innerHTML = `<div class="hint" style="background:#052e1a;border-color:#22c55e55;color:#86efac">${first?'¡Reto de hoy conseguido! Vuelve mañana por otro.':'Ya lo habías completado hoy, ¡buen repaso!'}</div>`;
  } else {
    out.className='outbox err';
    out.textContent='❌ Todavía no.\n\nObtenido:\n'+(res.logs.join('\n')||'(nada)')+'\n\nSe esperaba:\n'+c.expected.join('\n');
  }
}

/* ============================ Utilidades UI ============================ */
function escapeHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
let toastTimer=null;
function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'), 2200);
}
let audioCtx=null;
function sfx(ok){
  try{ if(navigator.vibrate) navigator.vibrate(ok?[25]:[55,40,55]); }catch(e){}
  if(state.sound===false) return;
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended') audioCtx.resume();
    const notes = ok?[660,990]:[200,150];
    notes.forEach(function(f,i){
      const o=audioCtx.createOscillator(), g=audioCtx.createGain();
      o.type='sine'; o.frequency.value=f; o.connect(g); g.connect(audioCtx.destination);
      const t=audioCtx.currentTime + i*0.09;
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.14,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.16);
      o.start(t); o.stop(t+0.18);
    });
  }catch(e){}
}
function toggleSound(){ state.sound=!state.sound; save(); render(); toast(state.sound?'🔊 Sonido activado':'🔇 Sonido desactivado'); }
function confetti(){
  const colors=['#38bdf8','#818cf8','#22c55e','#f59e0b','#f43f5e','#a78bfa'];

    const d=document.createElement('div'); d.className='confetti';
    d.style.left=Math.random()*100+'vw';

    d.style.animationDuration=(1.6+Math.random()*1.4)+'s';

  }
}

/* ============================ Ejecutor de código (Worker) ============================ */
function workerMain(){
  self.onmessage = function(e){
    var d = e.data;
    function fmtJs(v){
      if(v===undefined) return 'undefined';
      if(v===null) return 'null';
      if(Array.isArray(v)) return '['+v.map(fmtJs).join(', ')+']';
      if(typeof v==='object'){ try{ return JSON.stringify(v); }catch(x){ return String(v); } }
      return String(v);
    }
    function fmtPy(v){
      if(v===undefined) return '';
      if(v===null) return 'None';
      if(typeof v==='boolean') return v?'True':'False';
      if(Array.isArray(v)) return '['+v.map(fmtPy).join(', ')+']';
      if(typeof v==='object'){ try{ return JSON.stringify(v); }catch(x){ return String(v); } }
      return String(v);
    }
    var logs=[];
    function pushJs(){ logs.push(Array.prototype.map.call(arguments, fmtJs).join(' ')); }
    function __out(){ logs.push(Array.prototype.map.call(arguments, fmtPy).join(' ')); }
    var __console = { log:pushJs, info:pushJs, warn:pushJs, error:pushJs, debug:pushJs };
    function __fdiv(a,b){ return Math.floor(a/b); }
    function __len(x){ return (x==null)?0:(x.length!==undefined?x.length:Object.keys(x).length); }
    function __int(x){ return parseInt(x,10)||0; }
    function __float(x){ return parseFloat(x); }
    function __str(x){ return fmtPy(x); }

    function trExpr(s){
      s = s.replace(/\bTrue\b/g,'true').replace(/\bFalse\b/g,'false').replace(/\bNone\b/g,'null');
      s = s.replace(/f"([^"]*)"/g, function(_,c){ return '`'+c.replace(/\{([^}]*)\}/g,'${$1}')+'`'; });
      s = s.replace(/f'([^']*)'/g, function(_,c){ return '`'+c.replace(/\{([^}]*)\}/g,'${$1}')+'`'; });
      s = s.replace(/([\w\.\[\]]+)\s*\/\/\s*([\w\.\[\]]+)/g,'__fdiv($1,$2)');
      s = s.replace(/([\w\.\[\]]+)\s+not\s+in\s+([\w\.\[\]]+)/g,'!($2.includes($1))');
      s = s.replace(/([\w\.\[\]]+)\s+in\s+([\w\.\[\]]+)/g,'$2.includes($1)');
      s = s.replace(/\band\b/g,'&&').replace(/\bor\b/g,'||').replace(/\bnot\b/g,'!');
      return s;
    }
    function transpile(src){
      var lines = String(src).replace(/\t/g,'    ').split(/\r?\n/);
      var out=[], stack=[];
      function closeTo(ind){ while(stack.length && ind<=stack[stack.length-1]){ out.push('}'); stack.pop(); } }
      for(var i=0;i<lines.length;i++){
        var raw=lines[i]; if(raw.trim()==='') continue;
        var indent=raw.match(/^ */)[0].length;
        var line=raw.trim();
        var ci=line.indexOf('#'); if(ci>=0) line=line.slice(0,ci).trim();
        if(line==='') continue;

        if(/^else\s*:/.test(line)){ out.push('} else {'); stack.pop(); stack.push(indent); continue; }
        var me=line.match(/^elif\s+(.+):\s*$/);
        if(me){ out.push('} else if ('+trExpr(me[1])+') {'); stack.pop(); stack.push(indent); continue; }

        closeTo(indent);

        var md=line.match(/^def\s+(\w+)\s*\((.*)\)\s*:\s*$/);
        if(md){ out.push('function '+md[1]+'('+md[2]+') {'); stack.push(indent); continue; }
        var mif=line.match(/^if\s+(.+):\s*$/);
        if(mif){ out.push('if ('+trExpr(mif[1])+') {'); stack.push(indent); continue; }
        var mw=line.match(/^while\s+(.+):\s*$/);
        if(mw){ out.push('while ('+trExpr(mw[1])+') {'); stack.push(indent); continue; }
        var mf=line.match(/^for\s+(\w+)\s+in\s+range\s*\(([^)]*)\)\s*:\s*$/);
        if(mf){
          var v=mf[1], args=mf[2].split(',').map(function(x){return trExpr(x.trim());});
          var a0,b0,step,cond;
          if(args.length===1){ a0='0'; b0=args[0]; step='1'; }
          else if(args.length===2){ a0=args[0]; b0=args[1]; step='1'; }
          else { a0=args[0]; b0=args[1]; step=args[2]; }
          if(step.charAt(0)==='-'){ cond=v+' > '+b0; } else { cond=v+' < '+b0; }
          out.push('for (let '+v+' = '+a0+'; '+cond+'; '+v+' += '+step+') {'); stack.push(indent); continue;
        }
        var mfi=line.match(/^for\s+(\w+)\s+in\s+(.+):\s*$/);
        if(mfi){ out.push('for (let '+mfi[1]+' of '+trExpr(mfi[2])+') {'); stack.push(indent); continue; }
        var mr=line.match(/^return\s*(.*)$/);
        if(mr){ out.push('return '+(mr[1]?trExpr(mr[1]):'')+';'); continue; }
        if(/^(break|continue|pass)\s*$/.test(line)){ if(line!=='pass') out.push(line+';'); continue; }
        var mae=line.match(/^([A-Za-z_]\w*)\s*(\+=|-=|\*=|\/=|%=)\s*(.+)$/);
        if(mae){ out.push(mae[1]+' '+mae[2]+' '+trExpr(mae[3])+';'); continue; }
        var ma=line.match(/^([A-Za-z_]\w*)\s*=(?!=)\s*(.+)$/);
        if(ma){ out.push('let '+ma[1]+' = '+trExpr(ma[2])+';'); continue; }
        out.push(trExpr(line)+';');
      }
      while(stack.length){ out.push('}'); stack.pop(); }
      return out.join('\n');
    }

    try{
      var body;
      if(d.lang==='python'){ body = 'var print=__out, len=__len, int=__int, float=__float, str=__str;\n'+transpile(d.code); }
      else { body = 'var console=__console;\n'+d.code; }
      var fn = new Function('__out','__console','__fdiv','__len','__int','__float','__str', body);
      fn(__out,__console,__fdiv,__len,__int,__float,__str);
      self.postMessage({ok:true, logs:logs, error:null});
    }catch(err){
      self.postMessage({ok:false, logs:logs, error:String((err&&err.message)||err)});
    }
  };
}

function runCode(lang, code){
  return new Promise(function(resolve){
    var blob = new Blob(['('+workerMain.toString()+')()'], {type:'application/javascript'});
    var url = URL.createObjectURL(blob);
    var w = new Worker(url);
    var done=false;
    var timer=setTimeout(function(){ if(done)return; done=true; w.terminate(); URL.revokeObjectURL(url);
      resolve({ok:false, logs:[], error:'Tiempo agotado ⏱️ (posible bucle infinito)'}); }, 4000);
    w.onmessage=function(e){ if(done)return; done=true; clearTimeout(timer); w.terminate(); URL.revokeObjectURL(url); resolve(e.data); };
    w.onerror=function(e){ if(done)return; done=true; clearTimeout(timer); w.terminate(); URL.revokeObjectURL(url);
      resolve({ok:false, logs:[], error:String(e.message||'Error de sintaxis')}); };
    w.postMessage({lang:lang, code:code});
  });
}
